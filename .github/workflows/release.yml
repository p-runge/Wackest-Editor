name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build-script: build:mac
            asset-globs: |
              dist/*.dmg
              dist/*.zip
              dist/latest-mac.yml
          - os: windows-latest
            build-script: build:win
            asset-globs: |
              dist/*-setup.exe
              dist/latest.yml
              dist/*.exe.blockmap
          - os: ubuntu-latest
            build-script: build:linux
            asset-globs: |
              dist/*.AppImage
              dist/latest-linux.yml

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run ${{ matrix.build-script }}

      - name: Compute version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ matrix.asset-globs }}
          body: |
            ## Downloads

            | Platform | File |
            | --- | --- |
            | 🪟 Windows | [wackest-editor-${{ steps.version.outputs.version }}-setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/wackest-editor-${{ steps.version.outputs.version }}-setup.exe) |
            | 🍎 macOS | [wackest-editor-${{ steps.version.outputs.version }}.dmg](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/wackest-editor-${{ steps.version.outputs.version }}.dmg) |
            | 🐧 Linux | [wackest-editor-${{ steps.version.outputs.version }}.AppImage](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/wackest-editor-${{ steps.version.outputs.version }}.AppImage) |

            The other files attached to this release (`.yml`, `.blockmap`, `.zip`) are used internally by the app's auto-updater and don't need to be downloaded manually.
